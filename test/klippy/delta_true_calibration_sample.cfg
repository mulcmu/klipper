# Sample configuration for testing delta calibration performance.
# Use with scripts/delta_calibrate_test.py to generate simulated probe data.
#
# DO NOT load this file into klipper directly -- it is only for use with
# the delta_calibrate_test.py CLI tool.

# Physical ground-truth delta calibration parameters.
# These represent the *actual* (true) geometry of the printer being simulated.
# The CLI tool uses these to compute what a probe would measure and what
# distance measurements the calibration object would yield.
#
# Required parameters:
#   delta_radius   - radial distance from center axis to each tower (mm)
#   arm_length     - arm length shared by all towers, OR per-tower
#                    arm_length_a / arm_length_b / arm_length_c (mm)
#   endstop_a      - position_endstop for tower A (mm); B and C default to A
#
# Optional parameters (with defaults):
#   arm_length_b/c - defaults to arm_length_a (or arm_length)
#   endstop_b/c    - defaults to endstop_a
#   angle_a        - tower A angle in degrees (default: 210.0)
#   angle_b        - tower B angle in degrees (default: 330.0)
#   angle_c        - tower C angle in degrees (default: 90.0)
#   stepdist_a/b/c - step distance in mm/step (default: 0.0001)
#   bed_tilt_x     - bed tilt along X axis in mm/mm (default: 0.0)
#   bed_tilt_y     - bed tilt along Y axis in mm/mm (default: 0.0)
#
# Bed tilt models a bed that is perfectly flat but tilted relative to the
# printer Z axis.  The bed surface height at (x, y) is:
#   z = bed_tilt_x * x + bed_tilt_y * y
# where z = 0 at the center of the bed.

# --- Example 1: Ideal printer with perfect symmetry ---
[delta_true_calibration]
delta_radius: 174.75
arm_length: 333.0
endstop_a: 297.05
# angle_a: 210.0          # (defaults shown for reference)
# angle_b: 330.0
# angle_c: 90.0
# stepdist_a: 0.0001
# bed_tilt_x: 0.0
# bed_tilt_y: 0.0

# Standard calibration probe radius (must match [delta_calibrate] below)
[delta_calibrate]
radius: 50

